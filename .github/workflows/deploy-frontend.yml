name: Betfusion Frontend Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-2               
      S3_BUCKET_NAME: betfusion.ke-frontend
      CLOUDFRONT_DISTRIBUTION_ID: E177F95S7GLSUN
      BUILD_FOLDER: ./build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}           

      - name: Deploy to S3 Bucket (Long Cache)
        run: |
          aws s3 sync ${{ env.BUILD_FOLDER }} s3://${{ env.S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,public"

      - name: Deploy HTML to S3 (No Cache)
        run: |
          aws s3 cp ${{ env.BUILD_FOLDER }}/index.html s3://${{ env.S3_BUCKET_NAME }}/index.html \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate,public"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" --query "Invalidation.Id"
            
      - name: Get Deployment URL
        run: |
          DOMAIN_NAME=$(aws cloudfront get-distribution --id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --query "Distribution.DomainName" --output text)
          echo "🚀 Deployed successfully to: https://$DOMAIN_NAME"
